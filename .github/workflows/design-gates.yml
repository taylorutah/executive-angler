name: Design gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:contrast
      - run: npm run check:hex
      - run: npm run check:stored-html
      - run: npm run check:image-hosts
      - run: npm test
